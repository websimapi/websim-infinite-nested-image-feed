<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Nested Image Feed</title>
    <script type="importmap">
        {
            "imports": {
                "@websim/websim-socket": "https://esm.websim.com/@websim/websim-socket"
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease-in-out;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .comments-list {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(10px);
        }

        .comment-item {
            padding: 8px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 12px;
        }

        .comment-processed {
            background: rgba(0, 255, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="status" id="status">Loading comments from page metadata...</div>
        </div>

        <div class="comments-list">
            <h3 style="margin-bottom: 10px;">Recent Comments</h3>
            <div id="commentsList"></div>
        </div>

        <div class="canvas-container">
            <canvas id="renderCanvas"></canvas>
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <div>Generating image...</div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import WebsimSocket
        import { WebsimSocket } from '@websim/websim-socket';
        
        // Global variables
        const room = new WebsimSocket({
            schema: {
                comment: {
                    id: "uuid",
                    message: "text",
                    username: "text",
                    created_at: "timestamptz",
                    processed: "boolean"
                },
                generated_image: {
                    id: "uuid", 
                    comment_id: "uuid", 
                    comment_message: "text",
                    image_url: "text",
                    prompt_used: "text",
                    username: "text" 
                }
            }
        });
        let canvas, ctx;
        let currentImages = [];
        let isProcessing = false;
        let animationId;
        let currentLoggedInUser = null; 

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            canvas = document.getElementById('renderCanvas');
            ctx = canvas.getContext('2d');
            
            currentLoggedInUser = await window.websim.getCurrentUser(); 

            setupCanvas();
            startImageProcessor(); 
            startRenderer();
            loadComments(); 
        });

        function setupCanvas() {
            const updateCanvas = () => {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            };
            
            updateCanvas();
            window.addEventListener('resize', updateCanvas);
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        async function startImageProcessor() {
            if (!currentLoggedInUser || !currentLoggedInUser.username) {
                return;
            }
            
            setInterval(async () => {
                if (isProcessing) return;

                try {
                    const unprocessedComments = await room.query(
                        'SELECT c.id, c.message, c.username, c.created_at, c.processed FROM public.comment c WHERE c.processed = $1 AND c.username = $2 ORDER BY c.created_at ASC LIMIT 1',
                        [false, currentLoggedInUser.username]
                    );
                    
                    if (unprocessedComments.length > 0) {
                        const comment = unprocessedComments[0];
                        await processComment(comment);
                    }
                } catch (error) {
                    console.error('Error in image processor:', error);
                }
            }, 2000);
        }

        async function processComment(comment) {
            if (isProcessing) return;
            
            if (!currentLoggedInUser || !currentLoggedInUser.username || comment.username !== currentLoggedInUser.username) {
                updateStatus(`Skipping processing for comment by ${comment.username} as it's not for the current user.`);
                return;
            }
            
            isProcessing = true;
            updateStatus(`Processing: "${comment.message}" by ${comment.username}`);
            document.getElementById('loading').style.display = 'block';

            try {
                const prompt = `White Square in the center ${comment.message} White Square in the center`;
                
                const result = await websim.imageGen({
                    prompt: prompt,
                    aspect_ratio: "1:1"
                });

                await room.collection('generated_image').upsert({
                    comment_id: comment.id,
                    comment_message: comment.message,
                    image_url: result.url,
                    prompt_used: prompt,
                    username: comment.username
                });

                await room.collection('comment').upsert({
                    id: comment.id,
                    message: comment.message,
                    username: comment.username,
                    created_at: comment.created_at,
                    processed: true
                });

                updateStatus('Image generated successfully');
                
            } catch (error) {
                console.error('Error processing comment:', error);
                updateStatus('Error generating image');
            } finally {
                isProcessing = false;
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function loadComments() {
            try {
                updateStatus('Fetching comments from page metadata...');
                const currentProject = await window.websim.getCurrentProject();

                if (!currentProject || !currentProject.id) {
                    updateStatus('Could not get current project ID.');
                    return;
                }
                
                const response = await fetch(`/api/v1/projects/${currentProject.id}/comments?sort_order=desc&first=50`);
                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }
                const data = await response.json();
                
                if (!data.comments || !data.comments.data) {
                    throw new Error('Invalid comment data structure from API');
                }

                const pageComments = data.comments.data.map(item => ({
                    id: item.comment.id,
                    message: item.comment.raw_content || 'No content',
                    username: item.comment.author?.username || 'Anonymous',
                    created_at: item.comment.created_at,
                    processed: false 
                }));
                
                for (const comment of pageComments) {
                    const existingComment = await room.collection('comment').filter({ id: comment.id }).getList();
                    if (existingComment.length > 0 && existingComment[0].processed) {
                    } else {
                        await room.collection('comment').upsert(comment);
                    }
                }
                
                const dbComments = await room.query('SELECT c.id, c.message, c.username, c.created_at, c.processed FROM public.comment c ORDER BY c.created_at DESC');
                displayComments(dbComments); 

                const numUserCommentsToProcess = pageComments.filter(c => 
                    c.username === (currentLoggedInUser?.username) && !dbComments.find(dbc => dbc.id === c.id && dbc.processed)
                ).length;

                updateStatus(`Loaded ${pageComments.length} comments. You have ${numUserCommentsToProcess} of yours to process.`);
                
            } catch (error) {
                console.error('Error loading comments from metadata:', error);
                updateStatus(`Error loading comments: ${error.message}`);
            }
        }

        function displayComments(allComments) {
            const pendingComments = allComments.filter(c => !c.processed);
            const container = document.getElementById('commentsList');
            
            if (pendingComments.length === 0) {
                container.innerHTML = '<div class="comment-item">All comments processed! </div>';
                return;
            }
            
            container.innerHTML = pendingComments.map(comment => `
                <div class="comment-item">
                    <div style="font-weight: bold;">${comment.username}</div>
                    <div>${comment.message}</div>
                    <div style="opacity: 0.7; font-size: 10px;">
                        ${new Date(comment.created_at).toLocaleString()}
                        
                    </div>
                </div>
            `).join('');
        }

        async function startRenderer() {
            room.collection('generated_image').subscribe(async (images) => {
                if (images.length > 0) {
                    currentImages = images.sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());
                    await loadImages(); 
                } else {
                    currentImages = []; 
                    renderNestedImages([]); 
                }
            });
            
            room.query('SELECT c.id, c.message, c.username, c.created_at, c.processed FROM public.comment c ORDER BY c.created_at DESC')
                .subscribe(async (comments) => {
                    displayComments(comments);
            });

            const initialImages = await room.collection('generated_image').getList();
            if (initialImages.length > 0) {
                 currentImages = initialImages.sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());
                 await loadImages();
            }
        }

        async function loadImages() {
            const imageElements = [];
            
            for (const imageData of currentImages.slice(0, 10)) { 
                try {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                        img.src = imageData.image_url;
                    });
                    
                    imageElements.push({
                        img,
                        data: imageData
                    });
                } catch (error) {
                    console.error('Error loading image:', error);
                }
            }
            
            if (imageElements.length > 0) {
                renderNestedImages(imageElements);
            }
        }

        function renderNestedImages(imageElements) {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            
            let time = 0;
            const transitionDuration = 4000; 
            
            function animate() {
                time += 16; 
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (imageElements.length === 0) {
                    animationId = requestAnimationFrame(animate);
                    return;
                }
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const baseSize = Math.min(canvas.width, canvas.height) * 0.8;
                
                const totalCycleTime = transitionDuration * imageElements.length;
                const cycleTime = time % totalCycleTime;
                const currentIndex = Math.floor(cycleTime / transitionDuration) % imageElements.length;
                const nextIndex = (currentIndex + 1) % imageElements.length;
                const progress = (cycleTime % transitionDuration) / transitionDuration;
                
                const zoomFactor = 1 + (progress * 2); 
                
                const element = imageElements[currentIndex];
                let size = baseSize * zoomFactor;
                
                ctx.save();
                ctx.drawImage(
                    element.img,
                    centerX - size/2,
                    centerY - size/2,
                    size,
                    size
                );
                ctx.restore();
                
                if (progress > 0.3 && imageElements.length > 1) {
                    const nextElement = imageElements[nextIndex];
                    const whiteSquareSize = size * 0.4;
                    const nextImageProgress = Math.min((progress - 0.3) / 0.7, 1);
                    const nextSize = whiteSquareSize * nextImageProgress;
                    
                    ctx.save();
                    ctx.globalAlpha = nextImageProgress;
                    ctx.drawImage(
                        nextElement.img,
                        centerX - nextSize/2,
                        centerY - nextSize/2,
                        nextSize,
                        nextSize
                    );
                    ctx.restore();
                }
                
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(20, canvas.height - 100, canvas.width - 40, 80);
                
                ctx.fillStyle = '#fff';
                ctx.font = '18px Arial';
                ctx.textAlign = 'left';
                const maxWidth = canvas.width - 60;
                const words = element.data.comment_message.split(' ');
                let line = '';
                let y = canvas.height - 70;
                
                for (let n = 0; n < words.length; n++) {
                    const testLine = line + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    const testWidth = metrics.width;
                    if (testWidth > maxWidth && n > 0) {
                        ctx.fillText(line, 30, y);
                        line = words[n] + ' ';
                        y += 20;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, 30, y);
                
                ctx.font = '12px Arial';
                ctx.fillStyle = '#ccc';
                ctx.fillText(
                    `by ${element.data.username} • ${currentIndex + 1}/${imageElements.length}`,
                    30,
                    canvas.height - 20
                );
                ctx.restore();
                
                animationId = requestAnimationFrame(animate);
            }
            
            animate();
        }
    </script>

</body>
